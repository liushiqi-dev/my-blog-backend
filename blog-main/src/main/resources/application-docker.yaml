spring:
  datasource:
    url: jdbc:mysql://mysql:3306/blog
    username: root
    password: ${MYSQL_PASSWORD}   # 从容器环境变量读取（compose 从 .env 注入）
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}   # 从容器环境变量读取
      database: 0  # 默认使用0号数据库，Redis有0-15共16个库
      timeout: 2s   # 命令读写超时，防止 Redis 不可用时请求线程无限阻塞

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated  # 生产者确认消息到达 broker
    listener:
      simple:
        acknowledge-mode: manual        # 手动 ACK，DB 写入失败可重试
        prefetch: 1                     # 逐条消费，失败只重试一条
  flyway:
    baseline-on-migrate: true

# JWT配置
jwt:
  # RS256非对称加密密钥对（Base64编码）
  # 使用固定密钥，避免应用重启后旧JWT全部失效
  private-key: ${JWT_PRIVATE_KEY}   # 真实值在 .env，经 compose 环境变量注入
  public-key: ${JWT_PUBLIC_KEY}
  # Token过期时间（毫秒），默认7天
  expiration: 604800000

# RAG 知识库问答配置（统一走中转站单一 OpenAI 兼容端点：一个 base-url + 一个 key 同时提供 embedding 与 chat）
rag:
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}   # 中转站地址，.env 填真实值；默认值仅保证未配置时能启动
  api-key: ${LLM_API_KEY:}                # 中转站统一 key；空默认值：未配置时博客主站照常启动，仅 /kb 链路调用时报错
  embedding-model: text-embedding-3-small # 向量模型；中转站若用其它型号（如 bge-m3）改这一行与下面维度
  embedding-dimension: 1536               # 向量维度：建库/查询/FT.CREATE DIM 必须一致
  embedding-batch-size: 10                # 单次 embedding 请求文本条数（保守值）
  chat-model: deepseek-v4-flash           # 生成模型（旧名 deepseek-chat 已停用）
  chat-max-tokens: 1200                   # 限制输出长度，控成本与延迟
  chat-max-retries: 2                     # 网关偶发连接重置/空响应时的重试次数
  top-k: 5
  chunk-size: 500
  chunk-overlap: 50
  connect-timeout-ms: 3000
  embedding-read-timeout-ms: 15000
  chat-read-timeout-ms: 60000
