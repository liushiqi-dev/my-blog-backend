spring:
  datasource:
    url: jdbc:mysql://mysql:3306/blog
    username: root
    password: ${MYSQL_PASSWORD}   # 从容器环境变量读取（compose 从 .env 注入）
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}   # 从容器环境变量读取
      database: 0  # 默认使用0号数据库，Redis有0-15共16个库
      timeout: 2s   # 命令读写超时，防止 Redis 不可用时请求线程无限阻塞

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated  # 生产者确认消息到达 broker
    listener:
      simple:
        acknowledge-mode: manual        # 手动 ACK，DB 写入失败可重试
        prefetch: 1                     # 逐条消费，失败只重试一条
  flyway:
    baseline-on-migrate: true

# JWT配置
jwt:
  # RS256非对称加密密钥对（Base64编码）
  # 使用固定密钥，避免应用重启后旧JWT全部失效
  private-key: ${JWT_PRIVATE_KEY}   # 真实值在 .env，经 compose 环境变量注入
  public-key: ${JWT_PUBLIC_KEY}
  # Token过期时间（毫秒），默认7天
  expiration: 604800000

# RAG 知识库问答配置（双供应商：embedding 走阿里云百炼，chat 生成走 DeepSeek，均为 OpenAI 兼容接口）
rag:
  embedding:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}        # 默认空串，未配置时应用仍可启动，仅 /kb 接口报错
    model: text-embedding-v4
    dimension: 1024                        # 单一配置源：建库/查询/FT.CREATE DIM 必须一致
    batch-size: 10                         # 官方硬上限：单次请求最多 10 条文本
  chat:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-v4-flash
    max-tokens: 800                        # 限制输出长度，控制成本与延迟
  top-k: 5                                 # KNN 检索返回的候选分块数
  chunk-size: 500                          # 文章分块长度（字符）
  chunk-overlap: 50                        # 相邻分块重叠（字符），保留上下文
  connect-timeout-ms: 3000
  embedding-read-timeout-ms: 15000
  chat-read-timeout-ms: 30000              # LLM 生成慢，读超时须显著大于连接超时
