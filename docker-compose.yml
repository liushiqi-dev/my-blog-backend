services:            # 要跑的每个容器
  mysql:             # 服务名（compose 内部互访时用的名字，后面容器网络会用到）
    image: mysql:8.0        # 用哪个镜像、哪个版本
    container_name: blog-mysql   # 容器的显示名（docker ps 里看到的）
    restart: always    # 崩溃/服务器重启后自动拉起容器（自愈）
    environment:            # 传给容器内进程的环境变量，MySQL 镜像约定：
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # 真实密码在 .env（compose 自动读取同目录 .env）
      MYSQL_DATABASE: blog          # 初始化时顺手建一个空库
    volumes:
      - mysql-data:/var/lib/mysql   # 数据持久化：容器删了数据还在
    healthcheck:                    # 探活：让 backend 等到 MySQL 真正能接受连接（而非仅进程启动）再启动
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s                  # 每 5s 探一次
      timeout: 3s                   # 单次探测超过 3s 视为失败
      retries: 10                   # 连续失败 10 次才判定 unhealthy（给 MySQL 初始化留足时间）

  redis:
    image: redis:8    # Redis 8 开源版内置 Query Engine（FT.CREATE/FT.SEARCH），后续 RAG 向量检索要用
    container_name: blog-redis
    restart: always   # 必须显式声明：宿主机重启后其他服务靠本行自愈，缺失则 redis 不会自动拉起，后端解析不到 redis 主机名会全站报错
    # appendonly=AOF 持久化防重启丢数据；noeviction 防向量索引被 LRU 淘汰导致召回失真
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]  # 密码从 .env 注入
    volumes:
      - redis-data:/data   # 数据持久化：容器删了点赞/浏览量缓存还在
    healthcheck:           # 探活：redis-cli 带密码 ping，返回 PONG 即视为就绪
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management   # -management 后缀 = 带网页管理台
    container_name: blog-rabbitmq
    restart: always
    healthcheck:                   # 探活：rabbitmq-diagnostics ping 检查节点是否就绪
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s                # RabbitMQ 启动较慢，探测间隔放宽到 10s
      timeout: 5s
      retries: 10

  backend:
    image: crpi-gvp1w2xkwoo3w9zx.cn-beijing.personal.cr.aliyuncs.com/blog-lsq/blog-backend:latest
    container_name: blog-backend
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # 以下密码从 .env 透传给容器，Spring 在 application-docker.yaml 中用 ${} 读取
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}       # RAG 中转站（OpenAI 兼容网关）地址，embedding 与 chat 共用
      - LLM_API_KEY=${LLM_API_KEY}         # RAG 中转站统一密钥，embedding 与 chat 共用
    depends_on:                    # 条件式依赖：等下面三个服务 healthcheck 通过（service_healthy）后 backend 才启动
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    image: crpi-gvp1w2xkwoo3w9zx.cn-beijing.personal.cr.aliyuncs.com/blog-lsq/blog-frontend:latest
    container_name: blog-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:         # 声明上面用到的具名卷（Docker 托理的一块存储空间）
  redis-data:         # redis 的具名卷（AOF 持久化文件存这里）